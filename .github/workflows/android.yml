name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'scripts/apk-transfer.py'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Build installable test APK
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Android SDK: $ANDROID_HOME"
            if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
            fi
            cd android
            gradle --no-daemon assembleDebug
          } 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/android-build.log" ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'android-build.log').read_text()[-16000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build diagnostics::' + text)
          PY
          fi
      - name: Verify APK and provide API-accessible transfer
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-verification.txt"
          # Artifact downloads use Azure storage, unreachable from some clients.
          # For this small, public test APK, annotations provide an API-only fallback.
          # No signing keys or other private files are included.
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          apk = Path('android/app/build/outputs/apk/debug/app-debug.apk').read_bytes()
          print('::notice title=APK SHA256::' + hashlib.sha256(apk).hexdigest())
          report = Path(os.environ['RUNNER_TEMP'], 'apk-verification.txt').read_text()
          print('::notice title=APK signature verification::' + report.replace('%', '%25').replace('\n', '%0A'))
          PY
      - name: API transfer batch 1
        run: python3 scripts/apk-transfer.py 0
      - name: API transfer batch 2
        run: python3 scripts/apk-transfer.py 1
      - name: API transfer batch 3
        run: python3 scripts/apk-transfer.py 2
      - uses: actions/upload-artifact@v4
        with:
          name: Superyau-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
