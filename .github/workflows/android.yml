name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Build installable test APK
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Android SDK: $ANDROID_HOME"
            if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
            fi
            cd android
            gradle --no-daemon assembleDebug
          } 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/android-build.log" ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'android-build.log').read_text()[-16000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build diagnostics::' + text)
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Superyau-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
